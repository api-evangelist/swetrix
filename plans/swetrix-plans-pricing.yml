specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Swetrix
providerId: swetrix
created: '2026-05-04'
modified: '2026-08-13'
generated: '2026-08-13'
method: searched
reconciled: true
sources:
  - https://swetrix.com/pricing
  - https://swetrix.com/docs/exceeding-plan-limits
  - https://swetrix.com/docs/statistics-api
tags:
  - Analytics
  - Cookieless Tracking
  - GDPR Compliant
  - Open Source
  - Privacy
  - Real-Time Analytics
  - Web Analytics
plan_count: 3
description: >-
  Swetrix sells two self-serve subscription tiers plus a negotiated Enterprise
  tier. Price is a function of TWO choices: the tier (Standard or Plus, which
  decides the feature set, website count and API rate limit) and a monthly-event
  volume selected from a slider (100K, 200K, 500K, 1M, 2M, 5M, 10M, 15M, 20M,
  30M, 40M, 50M, 50M+). The prices captured below are the published entry price
  at the 100,000-events step; prices at higher event volumes are rendered by the
  slider and are not recorded here rather than guessed. Annual billing is
  discounted 17%. There is no free cloud plan — the free option is the AGPL-3.0
  Community Edition, self-hosted. A 14-day free trial requires a payment method.
  This artifact REPLACES an earlier bulk-sweep version that described a
  Starter/Professional/Business/Enterprise/Plus/Advanced ladder; Swetrix has since
  restructured pricing and none of those tier names exist on the pricing page.
billing:
  currency: USD
  tax: VAT added where applicable
  periods: [month, year]
  annual_discount: '17%'
  processor: Paddle
  trial:
    length_days: 14
    payment_method_required: true
    cancel_anytime: true
  free_plan: false
  self_hosted_free: true
  proration: >-
    "You can upgrade or downgrade your plan anytime, and we will pro-rate your
    subscription."
  overage_policy: >-
    No automatic upgrade and no overage charge. Swetrix may lock the dashboard
    after 7 days notice if the plan is exceeded for two consecutive months or by
    more than 30%, or after 5 failed billing attempts. While locked, new events
    are not accepted; existing data is retained.
event_volume_steps:
  ['100K', '200K', '500K', '1M', '2M', '5M', '10M', '15M', '20M', '30M', '40M', '50M', '50M+']
plans:
  - id: swetrix-standard
    name: Standard
    type: subscription
    description: >-
      Entry tier. From $19/month at 100,000 monthly events, +VAT. Includes the
      core analytics, funnels, error tracking, performance monitoring, revenue
      tracking, SEO/GEO insights, alerts and API access. Excludes session
      replays, feature flags and A/B testing.
    entries:
      - label: Base Subscription
        name: base_subscription
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: 'from $19/month (100K events step); annual billing -17%'
        userMultiplied: false
      - label: Monthly Events
        name: monthly_events
        type: quota
        metric: event
        limit: 100000
        timeFrame: month
        geo: global
        unit: 1
        price: 'scales with the selected volume step, up to 50M'
        userMultiplied: false
      - label: API Requests
        name: api_requests
        type: quota
        metric: request
        limit: 300
        timeFrame: hour
        geo: global
        unit: 1
        price: '0'
        userMultiplied: false
    limits:
      websites: 10
      team_members: unlimited
      monthly_events_max: 50000000
      api_rate_limit: 300 requests/hour
    elements:
      - name: Real-time dashboard
      - name: Cookieless tracking
      - name: No data sampling
      - name: Public & shareable dashboards
      - name: Google Analytics import
      - name: Events & Goals
      - name: Funnels
      - name: User flow
      - name: Segments / saved views
      - name: Ask AI
      - name: Session & User profile analysis
      - name: Performance monitoring
      - name: Error tracking
      - name: SEO & GEO insights
      - name: Revenue tracking
      - name: Email reports
      - name: Alerts & notifications
      - name: Advanced bot detection
      - name: Ad-blocker bypass
      - name: reCAPTCHA alternative
      - name: GDPR & privacy compliant
      - name: Open source
      - name: Two-factor authentication
      - name: RESTful API & SDKs
      - name: Human support
  - id: swetrix-plus
    name: Plus
    type: subscription
    description: >-
      Marketed as "Best value". From $39/month at 100,000 monthly events, +VAT.
      Everything in Standard plus session replays, feature flags, A/B testing,
      100 websites, 20x higher API rate limits and priority support.
    entries:
      - label: Base Subscription
        name: base_subscription
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: 'from $39/month (100K events step); annual billing -17%'
        userMultiplied: false
      - label: Monthly Events
        name: monthly_events
        type: quota
        metric: event
        limit: 100000
        timeFrame: month
        geo: global
        unit: 1
        price: 'scales with the selected volume step, up to 50M'
        userMultiplied: false
      - label: API Requests
        name: api_requests
        type: quota
        metric: request
        limit: 6000
        timeFrame: hour
        geo: global
        unit: 1
        price: '0'
        userMultiplied: false
    limits:
      websites: 100
      team_members: unlimited
      monthly_events_max: 50000000
      api_rate_limit: 6000 requests/hour
    elements:
      - name: Everything from Standard
      - name: Session replays
      - name: Feature flags
      - name: A/B testing
      - name: 20x higher API rate limits
      - name: Priority support
  - id: swetrix-enterprise
    name: Enterprise
    type: subscription
    description: >-
      Negotiated. No published price — "Custom / Contact us". Everything in Plus
      plus custom event limits, on-premise or dedicated isolated instances,
      SAML SSO, personal onboarding, manual invoicing and an Enterprise SLA.
    entries:
      - label: Base Subscription
        name: base_subscription
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: custom — contact sales
        userMultiplied: false
      - label: Monthly Events
        name: monthly_events
        type: quota
        metric: event
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: custom
        userMultiplied: false
      - label: API Requests
        name: api_requests
        type: quota
        metric: request
        limit: -1
        timeFrame: hour
        geo: global
        unit: 1
        price: 'custom, and may be unlimited on demand'
        userMultiplied: false
    limits:
      websites: custom
      team_members: unlimited
      monthly_events_max: custom
      api_rate_limit: custom
    elements:
      - name: Everything from Plus
      - name: Dedicated account manager
      - name: Custom event limits
      - name: Custom features
      - name: On-premise installation
      - name: Dedicated isolated instance
      - name: SAML-based single sign-on (SSO)
      - name: Personal onboarding
      - name: Manual invoicing
      - name: Enterprise SLA
