aid: swetrix
name: Swetrix
description: >-
  Swetrix is an open source, privacy-focused web analytics platform that provides cookieless tracking, real-time
  dashboards, and GDPR-compliant analytics without collecting personal data. It offers a fully-featured REST API for
  tracking events, querying statistics, managing projects, and integrating analytics into custom applications.
