note: >-
  Swetrix publishes no changelog page on swetrix.com — https://swetrix.com/changelog
  and https://swetrix.com/docs/changelog both return 404 (probed 2026-08-13). The
  dated release history lives entirely in GitHub Releases on the Swetrix/swetrix
  monorepo, which tags three independent lines: the platform (vN.N.N), the browser
  tracker (tracker-js@N.N.N), the server tracker (tracker-node@N.N.N) and the
  CAPTCHA widget (captcha@N.N.N). Breaking changes are called out with a GitHub
  [!WARNING] / [!IMPORTANT] callout plus migration instructions, but only for
  self-hosted installations; the docs carry no cloud-API change history.
release_lines:
