    evidence: GET /v2/projects/{pid}/profiles/{profileId}/sessions
  - from: Error
    to: Session
    kind: has_many
    via: eid
    evidence: GET /v2/projects/{pid}/errors/{eid}/sessions
  - from: RevenueEvent
    to: Profile
    kind: belongs_to
    via: profileId
  - from: RevenueEvent
    to: Session
    kind: belongs_to
    via: sessionId
dimensions:
  note: >-
    Analytics reads are sliced by a fixed dimension vocabulary rather than by
    joins. The full list is discoverable at runtime via
    GET /v2/projects/{pid}/dimensions.
  columns:
    cc: country code
    rg: region
    ct: city
    host: hostname
    pg: page
    lc: locale
    br: browser
    brv: browser version
    os: operating system
    osv: OS version
    dv: device
    ref: referrer
    so: source
    me: medium
    ca: campaign
    te: UTM term
    co: UTM content
    isp: ISP
    og: organisation (network)
    ut: usage type
    ctp: connection type
