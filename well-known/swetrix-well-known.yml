note: >-
  Every /.well-known/ path probed on every Swetrix host returned 404. NO
  WellKnown and NO SecurityTxt pointer is emitted in apis.yml, because this file
  documents an absence, not a presence. api.swetrix.com answers with the NestJS
  JSON 404 envelope ({"message":"Cannot GET ...","error":"Not Found",
  "statusCode":404}); swetrix.com answers with the Remix HTML 404 page — neither
  is a served discovery document. Swetrix does publish a security contact, but on
  a human page (https://swetrix.com/security → security@swetrix.com) rather than
  an RFC 9116 security.txt; that is captured in
  security/swetrix-vulnerability-disclosure.yml.
