  or an @modelcontextprotocol package. The tools below are a DERIVED CANDIDATE
  surface — one tool per unique OpenAPI operationId — offered as a starting point
  for Swetrix, not a claim that any of it is deployed. Because nothing is
  deployed, apis.yml deliberately carries NO `type: MCPServer` pointer: the
  pointer asserts a reachable agent surface and there is none.
